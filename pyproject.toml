[project]
name = "agent-tools"
version = "0.1.0"
description = "Agent-native utility API bundle — MCP server + REST API with x402 micropayments"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qrcode[pil]>=8.0",
    "dnspython>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
x402 = ["x402[fastapi,evm]>=2.9"]
mcp = ["mcp>=1.25,<2"]
all = ["agent-tools[x402,mcp]"]
dev = ["ruff>=0.8", "pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
