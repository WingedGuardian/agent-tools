# Fly.io deployment config
# Deploy: fly launch --copy-config && fly deploy

app = "agent-tools"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENT_TOOLS_TESTNET = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
